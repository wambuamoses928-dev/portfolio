<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;
    background:#F5FBF7;
    background-image:radial-gradient(900px 520px at 6% -10%,rgba(14,124,62,.12),transparent 65%),radial-gradient(720px 460px at 98% -4%,rgba(11,99,245,.09),transparent 62%);
    padding:64px 70px;display:flex;flex-direction:column;justify-content:space-between;color:#101828}
  .top{display:flex;justify-content:space-between;align-items:center}
  .mark{display:flex;align-items:center;gap:12px;font-weight:600;font-size:20px}
  .dot{width:11px;height:11px;border-radius:50%;background:#0E7C3E;box-shadow:0 0 0 5px rgba(14,124,62,.15)}
  .tag{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#0E7C3E;font-weight:600}
  h1{font-family:"Playfair Display",serif;font-weight:800;font-size:74px;line-height:1.03;letter-spacing:-.03em;max-width:19ch}
  h1 em{font-style:italic;color:#0E7C3E}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #DCE9E1;padding-top:24px}
  .foot p{color:#47555F;font-size:21px;max-width:30ch;line-height:1.4}
  .chips{display:flex;gap:10px}
  .chips span{border:1px solid #CFEBD9;background:#fff;color:#0A5A2C;border-radius:999px;padding:9px 16px;font-size:16px;font-weight:500}
</style></head><body>
  <div class="top"><div class="mark"><span class="dot"></span>Wambua Moses Masila</div><span class="tag">Portfolio</span></div>
  <h1>I build web products that <em>handle real money.</em></h1>
  <div class="foot">
    <p>Paid platforms, M-Pesa payments, admin dashboards and Telegram alerts.</p>
    <div class="chips"><span>EarnKsh</span><span>NexMint</span><span>LiveBoost</span></div>
  </div>
</body></html>
