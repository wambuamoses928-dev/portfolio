<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;
    background:#F4F9F5;
    background-image:radial-gradient(760px 460px at 92% -12%,rgba(8,127,91,.13),transparent 64%),radial-gradient(620px 400px at 2% 4%,rgba(8,127,91,.08),transparent 66%);
    padding:62px 68px;display:flex;flex-direction:column;justify-content:space-between;color:#111827}
  .top{display:flex;justify-content:space-between;align-items:center}
  .mark{display:flex;align-items:center;gap:12px;font-weight:600;font-size:19px;letter-spacing:-.01em}
  .dot{width:10px;height:10px;border-radius:50%;background:#087F5B;box-shadow:0 0 0 5px rgba(8,127,91,.14)}
  .tag{font-size:13px;letter-spacing:.17em;text-transform:uppercase;color:#087F5B;font-weight:600}
  h1{font-family:"Playfair Display",serif;font-weight:800;font-size:76px;line-height:1.03;letter-spacing:-.032em;max-width:17ch}
  h1 em{font-style:italic;color:#087F5B}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #DCE7E0;padding-top:22px}
  .foot p{color:#53616B;font-size:19px;max-width:30ch;line-height:1.45}
  .chips{display:flex;gap:9px}
  .chips span{border:1px solid #D3E6DB;background:#fff;color:#065F46;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
</style></head><body>
  <div class="top"><div class="mark"><span class="dot"></span>Wambua Moses</div><span class="tag">Independent software engineer</span></div>
  <h1>I build web products that <em>handle real money.</em></h1>
  <div class="foot">
    <p>Live products, M-Pesa payments and automation, built end to end.</p>
    <div class="chips"><span>NexMint</span><span>LiveBoost</span><span>Sigma Tech</span><span>EarnKsh</span></div>
  </div>
</body></html>
